name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies (Workspaces)
        run: npm ci

      - name: Build Backend BFF
        run: npm run build:backend

      - name: Build Frontend UI
        run: npm run build:frontend

      - name: Verify Docker Compose Configuration
        run: docker compose config

      - name: Execute Protocol Interoperability Test Suite (TC-01 - TC-05)
        run: npm run test:interop
