services:
  - type: web
    name: mosip-vc-playground
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 4000
      - key: NODE_ENV
        value: production
      - key: MOSIP_INJI_CERTIFY_URL
        value: https://injicertify-mosipid.collab.mosip.net
      - key: MOSIP_INJI_MIMOTO_URL
        value: https://api.collab.mosip.net
      - key: MOSIP_INJI_VERIFY_URL
        value: https://injiverify.collab.mosip.net
