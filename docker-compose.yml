services:
  bff:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mosip-playground-bff
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - NODE_ENV=development
      - FRONTEND_URL=http://localhost:5173
      - MOSIP_INJI_CERTIFY_URL=https://certify.collab.mosip.net
      - MOSIP_MIMOTO_URL=https://mimoto.collab.mosip.net
      - MOSIP_INJI_VERIFY_URL=https://verify.collab.mosip.net
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - mosip-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mosip-playground-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_BFF_URL=http://localhost:4000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - bff
    networks:
      - mosip-net

networks:
  mosip-net:
    driver: bridge
